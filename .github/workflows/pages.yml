name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check the shared chrome
        run: python3 tools/check_chrome.py

      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache the Cargo registry, the build output and the installed tools
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: demo

      - name: Test the demo crate
        working-directory: demo
        run: cargo test --locked

      - name: Build the demo crate to WASM
        working-directory: demo
        run: cargo build --locked --release --target wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli at the version in Cargo.lock
        working-directory: demo
        run: cargo install wasm-bindgen-cli --locked --version "$(cargo pkgid wasm-bindgen | sed 's/.*[@#]//')"

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.3

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml basics patterns styles scripts images fonts _site/
          wasm-bindgen --target web --no-typescript --out-dir _site/wasm \
            demo/target/wasm32-unknown-unknown/release/demo.wasm
          (cd demo && cargo about generate --locked --fail -o ../_site/wasm/notices.html about.hbs)

      - uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1

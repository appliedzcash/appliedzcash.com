[package]
name = "demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "In-browser demos for appliedzcash.com, built to WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
blake2b_simd = "1"
hex = "0.4.3"
orchard = { version = "=0.16.0", default-features = false, features = ["std"] }
pasta_curves = { version = "0.6", default-features = false }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
wasm-bindgen = "0.2"
zcash_address = "0.14"
zcash_protocol = "0.11"
zip32 = "0.3"
zip321 = "0.10"

[profile.release]
opt-level = "s"
lto = true

[package]
name = "demo"
version = "0.1.0"
edition = "2021"
publish = false
description = "In-browser demos for appliedzcash.com, built to WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake2b_simd = "1"
hex = "0.4.3"
orchard = { version = "=0.16.0", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
